<body class="bg-neutral-900 text-neutral-100 font-sans">
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-neutral-900/80 border-b border-neutral-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold tracking-wider text-amber-500">GASTRO<span class="text-white">EXPERIENCE</span></a>
                </div>
                <div class="hidden md:flex items-center space-x-8">

            </div>
            <div class="overflow-hidden rounded-xl aspect-square bg-neutral-800">

                <img src="https://images.unsplash.com/photo-1577219491135-ce391730fb2c" alt="Chef" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            </div>

    <footer class="bg-neutral-950 border-t border-neutral-800 py-12 text-center text-neutral-500 text-sm">
